name: Rotate Secrets (Mautic)

on:
  workflow_dispatch:
    inputs:
      backup_before_rotation:
        description: "Backup Mautic before rotating secrets"
        required: false
        default: "true"
      rotate_db_password:
        description: "Rotate DB password (requires DB user update)"
        required: false
        default: "false"
      rotate_root_password:
        description: "Rotate MySQL ROOT password (DANGEROUS)"
        required: false
        default: "false"
      confirm_root_rotation:
        description: "Type ROTATE_ROOT to confirm"
        required: false

jobs:
  rotate-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # -------------------------
      # SAFETY BACKUP
      # -------------------------
      - name: Backup before rotation
        if: ${{ inputs.backup_before_rotation == 'true' }}
        uses: ./.github/actions/run-remote-script
        with:
          ssh_key: ${{ secrets.SSH_PRIVATE_KEY }}
          host: ${{ vars.LINODE_IP }}
          script: scripts/backup_mautic.sh
          env: "COMPOSE_PROJECT_NAME='${{ vars.COMPOSE_PROJECT_NAME }}' DEPLOY_DIR='${{ vars.DEPLOY_DIR }}' DB_NAME='${{ vars.DB_NAME }}' MYSQL_ROOT_PASSWORD='${{ secrets.MYSQL_ROOT_PASSWORD }}'"

      # -------------------------
      # OPTIONAL DB PASSWORD ROTATION
      # -------------------------

      - name: Rotate database password (optional)
        if: ${{ inputs.rotate_db_password == 'true' }}
        uses: ./.github/actions/run-remote-script
        with:
          ssh_key: ${{ secrets.SSH_PRIVATE_KEY }}
          host: ${{ vars.LINODE_IP }}
          script: scripts/rotate_db_password.sh
          env: "COMPOSE_PROJECT_NAME='${{ vars.COMPOSE_PROJECT_NAME }}' MYSQL_ROOT_PASSWORD='${{ secrets.MYSQL_ROOT_PASSWORD }}' NEW_DB_PASSWORD='${{ secrets.MYSQL_PASSWORD }}' MYSQL_USER='${{ vars.MYSQL_USER }}'"

      # -------------------------
      # OPTIONAL DB ROOT PASSWORD ROTATION (BREAK-GLASS)
      # -------------------------

      - name: Validate root password rotation confirmation
        if: ${{ inputs.rotate_root_password == 'true' }}
        run: |
          if [ "${{ inputs.confirm_root_rotation }}" != "ROTATE_ROOT" ]; then
            echo "❌ Root password rotation requires confirm_root_rotation=ROTATE_ROOT"
            exit 1
          fi

      #   Note: you must temporarily store both old and new root passwords
      - name: Rotate MySQL root password (break-glass)
        if: ${{ inputs.rotate_root_password == 'true' }}
        uses: ./.github/actions/run-remote-script
        with:
          ssh_key: ${{ secrets.SSH_PRIVATE_KEY }}
          host: ${{ vars.LINODE_IP }}
          script: scripts/rotate_mysql_root_password.sh
          env: "COMPOSE_PROJECT_NAME='${{ vars.COMPOSE_PROJECT_NAME }}' OLD_ROOT_PASSWORD='${{ secrets.MYSQL_ROOT_PASSWORD_OLD }}' NEW_ROOT_PASSWORD='${{ secrets.MYSQL_ROOT_PASSWORD }}'"

      # -------------------------
      # RECREATE APPLICATION CONTAINERS
      # -------------------------

      - name: Recreate containers with new secrets
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SOURCE: .
          REMOTE_HOST: ${{ vars.LINODE_IP }}
          REMOTE_USER: root
          TARGET: ${{ vars.DEPLOY_DIR }}
          SCRIPT_AFTER: |
            cd ${{ vars.DEPLOY_DIR }}

            # Replace placeholders in .env
            sed -i "s/__MYSQL_PASSWORD__/${{ secrets.MYSQL_PASSWORD }}/g" .env
            sed -i "s/__MYSQL_ROOT_PASSWORD__/${{ secrets.MYSQL_ROOT_PASSWORD }}/g" .env
            sed -i "s/__DOMAIN__/${{ vars.DOMAIN }}/g" .env
            sed -i "s/__PROJECT_NAME__/${{ vars.COMPOSE_PROJECT_NAME }}/g" .env
            sed -i "s/__DB_NAME__/${{ vars.DB_NAME }}/g" .env
            sed -i "s/__DB_USER__/${{ vars.MYSQL_USER }}/g" .env

            # Substitute placeholders in .mautic_env template
            sed -i "s/__MYSQL_PASSWORD__/${{ secrets.MYSQL_PASSWORD }}/g" .mautic_env
            sed -i "s/__DOMAIN__/${{ vars.DOMAIN }}/g" .mautic_env
            sed -i "s/__PROJECT_NAME__/${{ vars.COMPOSE_PROJECT_NAME }}/g" .mautic_env
            sed -i "s/__DB_NAME__/${{ vars.DB_NAME }}/g" .mautic_env
            sed -i "s/__DB_USER__/${{ vars.MYSQL_USER }}/g" .mautic_env

            # Recreate containers
            DEPLOY_DIR='${{ vars.DEPLOY_DIR }}' bash scripts/recreate-dc.sh
