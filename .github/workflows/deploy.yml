name: Deploy Mautic App (with Pre-Deploy Backup)

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      cleanup_env:
        description: 'Cleanup .env files and sensitive variables after deployment'
        default: 'true'
        required: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key

      - name: Backup Mautic before deployment
        if: ${{ vars.ENABLE_BACKUP != 'false' }}
        uses: ./.github/actions/run-remote-script
        with:
          ssh_key: ${{ secrets.SSH_PRIVATE_KEY }}
          host: ${{ vars.LINODE_IP }}
          script: scripts/backup_mautic.sh
          env: "COMPOSE_PROJECT_NAME='${{ vars.COMPOSE_PROJECT_NAME }}' DEPLOY_DIR='${{ vars.DEPLOY_DIR }}' DB_NAME='${{ vars.DB_NAME }}' MYSQL_ROOT_PASSWORD='${{ secrets.MYSQL_ROOT_PASSWORD }}'"

      - name: Check required secrets
        env:
          MAUTIC_PASSWORD: ${{ secrets.MAUTIC_PASSWORD }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$MAUTIC_PASSWORD" ]; then
            echo "Error: Missing MAUTIC_PASSWORD secret"
            exit 1
          fi
          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "Error: Missing SSH_PRIVATE_KEY secret"
            exit 1
          fi

      - name: Verify domain DNS
        if: ${{ vars.DOMAIN }}
        run: |
          DOMAIN_IP=$(dig +short ${{ vars.DOMAIN }})
          if [ "$DOMAIN_IP" != "${{ vars.LINODE_IP }}" ]; then
            echo "Error: Domain ${{ vars.DOMAIN }} does not point to Linode IP ${{ vars.LINODE_IP }}"
            exit 1
          fi
          echo "Domain ${{ vars.DOMAIN }} correctly points to Linode IP"

      - name: Deploy to Server
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SOURCE: .
          REMOTE_HOST: ${{ vars.LINODE_IP }}
          REMOTE_USER: root
          TARGET: ${{ vars.DEPLOY_DIR }}
          SCRIPT_AFTER: |
            cd ${{ vars.DEPLOY_DIR }}

            # Replace placeholders in setup-dc.sh
            sed -i "s/{{DOMAIN_NAME}}/${{ vars.DOMAIN }}/g" setup-dc.sh
            sed -i "s/{{EMAIL_ADDRESS}}/${{ vars.EMAIL }}/g" setup-dc.sh
            sed -i "s/{{MAUTIC_PASSWORD}}/${{ secrets.MAUTIC_PASSWORD }}/g" setup-dc.sh

            # Replace placeholders in .env
            sed -i "s/__MYSQL_PASSWORD__/${{ secrets.MYSQL_PASSWORD }}/g" .env
            sed -i "s/__MYSQL_ROOT_PASSWORD__/${{ secrets.MYSQL_ROOT_PASSWORD }}/g" .env
            sed -i "s/__DOMAIN__/${{ vars.DOMAIN }}/g" .env
            sed -i "s/__PROJECT_NAME__/${{ vars.COMPOSE_PROJECT_NAME }}/g" .env
            sed -i "s/__DB_NAME__/${{ vars.DB_NAME }}/g" .env
            sed -i "s/__DB_USER__/${{ vars.MYSQL_USER }}/g" .env

            # Substitute placeholders in the .mautic_env template
            sed -i "s/__MYSQL_PASSWORD__/${{ secrets.MYSQL_PASSWORD }}/g" .mautic_env
            sed -i "s/__DOMAIN__/${{ vars.DOMAIN }}/g" .mautic_env
            sed -i "s/__PROJECT_NAME__/${{ vars.COMPOSE_PROJECT_NAME }}/g" .mautic_env
            sed -i "s/__DB_NAME__/${{ vars.DB_NAME }}/g" .mautic_env
            sed -i "s/__DB_USER__/${{ vars.MYSQL_USER }}/g" .mautic_env

            # Run the setup script
            DEPLOY_DIR='${{ vars.DEPLOY_DIR }}' ./setup-dc.sh > ./setup-dc.log 2>&1

      - name: Download setup-dc.log
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          scp -o StrictHostKeyChecking=no root@${{ vars.LINODE_IP }}:${{ vars.DEPLOY_DIR }}/setup-dc.log ./
          cat setup-dc.log

      - name: Cleanup sensitive environment variables on server
        if: ${{ github.event.inputs.cleanup_env != 'false' }}
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/vps_key root@${{ vars.LINODE_IP }} \
          "DEPLOY_DIR='${{ vars.DEPLOY_DIR }}' bash -s" << 'EOF'
          set -euo pipefail

          echo "Removing secret-bearing files (.mautic_env, setup-dc.sh)"
          rm -f "$DEPLOY_DIR/.mautic_env" "$DEPLOY_DIR/setup-dc.sh"

          echo "Scrubbing secrets from .env (kept for project-name determinism)"
          if [ -f "$DEPLOY_DIR/.env" ]; then
            grep -Ev '^(MYSQL_PASSWORD|MYSQL_ROOT_PASSWORD)=' "$DEPLOY_DIR/.env" \
              > "$DEPLOY_DIR/.env.scrubbed"
            mv "$DEPLOY_DIR/.env.scrubbed" "$DEPLOY_DIR/.env"
          fi

          EOF
