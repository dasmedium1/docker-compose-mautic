name: Run script on VPS
description: Set up the SSH key, SCP a script to the Linode VPS, and run it over SSH.
inputs:
  ssh_key:
    description: SSH private key for the VPS
    required: true
  host:
    description: VPS IP or hostname
    required: true
  user:
    description: Remote user
    required: false
    default: root
  script:
    description: Path to the local script to run remotely
    required: true
  env:
    description: Env assignments to prefix the remote command (e.g. "BRAND_NAME='x' DB_NAME='y'")
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Set up SSH key
      shell: bash
      run: |
        mkdir -p ~/.ssh
        echo "${{ inputs.ssh_key }}" > ~/.ssh/vps_key
        chmod 600 ~/.ssh/vps_key

    - name: Run script on VPS
      shell: bash
      run: |
        SCRIPT_NAME="$(basename "${{ inputs.script }}")"
        scp -o StrictHostKeyChecking=no -i ~/.ssh/vps_key \
          "${{ inputs.script }}" \
          "${{ inputs.user }}@${{ inputs.host }}:/tmp/$SCRIPT_NAME"
        ssh -o StrictHostKeyChecking=no -i ~/.ssh/vps_key \
          "${{ inputs.user }}@${{ inputs.host }}" \
          "${{ inputs.env }} bash /tmp/$SCRIPT_NAME"
